<!doctype html>
<!--
  VARIANT A of V03: scene 5 is a placeholder (gap decision A). Renders for timing only; NOT FOR PUBLISHING.
  Render with: npx hyperframes render -c variants/gap-a.html --output ../output/V03-gap-a.mp4

  V03 Check your chain before it costs you a cassette — how-to, 34 s, 9:16.
  Built by build-video from ../composition-brief.md. Scene windows are the storyboard's; text scenes and the
  placeholder are sub-compositions from skills/build-video/compositions; captions use caption.css.
-->
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../caption.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #10201c; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      :root { --cap-bg: rgba(16, 32, 28, 0.92); --cap-fg: #ffffff; --cap-accent: #e8a33d; }
      #logo { position: absolute; left: auto; top: auto; right: 90px; bottom: 360px; width: 160px; height: 160px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1080" data-height="1920">

      <!-- 1 hook: the gauge drops in -->
      <video id="s1" class="clip" data-start="0" data-duration="4" data-media-start="0" src="../assets/A02.mp4" muted></video>
      <div id="c1a" class="clip caption" data-start="0" data-duration="1.9">Your chain is a wear item.</div>
      <div id="c1b" class="clip caption" data-start="1.9" data-duration="2.1">Here's the thirty-second check.</div>

      <!-- 2 signature -->
      <video id="s2" class="clip" data-start="4" data-duration="3" data-media-start="0" src="../assets/A01.mp4" data-has-audio="true" data-volume="1"></video>
      <div id="c2" class="clip caption" data-start="4" data-duration="3">I fix bikes for a living. Probably yours.</div>

      <!-- 3 the rule -->
      <div id="s3" class="clip" data-layout-allow-overflow data-start="7" data-duration="4" data-composition-id="ts-rule"
           data-composition-src="compositions/text-scene.html"
           data-variable-values='{"kicker":"The rule","line":"Measure it. Replace it at 0.5 %.","support":"0.5 % on an 11-speed; 0.75 % with fewer gears.","bg":"#10201c","fg":"#f3efe6","accent":"#e8a33d","entrance":"slide","align":"left"}'></div>

      <!-- 4a the check: drop the gauge in -->
      <video id="s4a" class="clip" data-start="11" data-duration="4" data-media-start="0" src="../assets/A02.mp4" muted></video>
      <div id="c4a" class="clip caption" data-start="11" data-duration="4">Drop the gauge in at the top of the chain.</div>

      <!-- 4b the check: step card -->
      <div id="s4b" class="clip" data-layout-allow-overflow data-start="15" data-duration="3" data-composition-id="ts-step2"
           data-composition-src="compositions/text-scene.html"
           data-variable-values='{"kicker":"2","line":"The 0.5 side drops in? Chain&apos;s done.","support":"","bg":"#10201c","fg":"#f3efe6","accent":"#e8a33d","entrance":"slide","align":"left"}'></div>

      <!-- 4c the check: three places -->
      <video id="s4c" class="clip" data-start="18" data-duration="3" data-media-start="1" src="../assets/A02.mp4" muted></video>
      <div id="c4c" class="clip caption" data-start="18" data-duration="3">Check in three places. Thirty seconds.</div>

      <!-- 5 what a worn chain does — VARIANT: gap 5 as decision A (placeholder). Not for publishing. -->
      <div id="s5" class="clip" data-start="21" data-duration="5" data-composition-id="ph-5"
           data-composition-src="compositions/placeholder.html"
           data-variable-values='{"shot":"worn cassette, close, 5 s","gap":"5"}'></div>

      <!-- 6 the result -->
      <div id="s6" class="clip" data-start="26" data-duration="4" data-composition-id="ts-result"
           data-composition-src="compositions/text-scene.html"
           data-variable-values='{"kicker":"On time","line":"About three chains per cassette.","support":"Chain from €25. Cassette from €45.","bg":"#10201c","fg":"#f3efe6","accent":"#e8a33d","entrance":"slam","align":"left"}'></div>

      <!-- 7 CTA -->
      <div id="s7" class="clip" data-start="30" data-duration="4" data-composition-id="ts-cta"
           data-composition-src="compositions/text-scene.html"
           data-variable-values='{"kicker":"","line":"The full check is on the site.","support":"northsidecycles.example/guides/chain-wear · Ask me anything below.","bg":"#10201c","fg":"#f3efe6","accent":"#e8a33d","entrance":"fade","align":"left"}'></div>
      <img id="logo" class="clip" data-start="30" data-duration="4" src="../assets/A03.png" alt="" />
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const capIn = (id, at) => tl.fromTo(id, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3 }, at);
      capIn("#c1a", 0); capIn("#c1b", 1.9); capIn("#c2", 4); capIn("#c4a", 11); capIn("#c4c", 18); 

      // Rule card slides out left at the end of its window; the step card comes from the right and goes back there.
      tl.to("#s3", { x: -120, opacity: 0, duration: 0.3 }, 10.7);
      tl.fromTo("#s4b", { x: 1080 }, { x: 0, duration: 0.3 }, 15);
      tl.to("#s4b", { x: 1080, duration: 0.1 }, 17.9);
      tl.fromTo("#s6", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 26);
      tl.to("#s6", { opacity: 0, duration: 0.3 }, 29.7);
      tl.fromTo("#logo", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 30.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
